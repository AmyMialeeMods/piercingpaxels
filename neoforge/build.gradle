architectury {
    platformSetupLoomIde()
    neoForge()
}

base {
    archivesName = "${mod_name}-neoforge-${minecraft_version}"
}

sourceSets.main.java.srcDir project(':common').file('src/main/java')
sourceSets.main.resources.srcDir project(':common').file('src/main/resources')

dependencies {
    neoForge "net.neoforged:neoforge:${neoforge_version}"
    implementation "dev.architectury:architectury-neoforge:${architectury_api_version}"
    implementation "io.github.llamalad7:mixinextras-neoforge:0.3.5"
}

processResources {
    inputs.property 'version', rootProject.version
    filesMatching('META-INF/neoforge.mods.toml') {
        expand version: rootProject.version
    }
}
