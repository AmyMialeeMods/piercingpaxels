plugins {
    id 'architectury-plugin' version '3.4.164'
    id 'dev.architectury.loom' version '1.7.435' apply false
}

architectury {
    minecraft = minecraft_version
}

subprojects {
    apply plugin: 'dev.architectury.loom'

    repositories {
        maven { url = 'https://maven.architectury.dev/' }
        maven { url = 'https://maven.fabricmc.net/' }
        maven { url = 'https://maven.neoforged.net/releases/' }
    }

    loom {
        silentMojangMappingsLicense()
    }

    dependencies {
        minecraft "com.mojang:minecraft:${rootProject.minecraft_version}"
        mappings loom.officialMojangMappings()
    }

    java {
        toolchain.languageVersion = JavaLanguageVersion.of(21)
        withSourcesJar()
        withJavadocJar()
    }

    jar {
        from(rootProject.file('LICENSE.md')) {
            rename { "${it}_${mod_name}" }
        }
        manifest {
            attributes([
                'Specification-Title'     : mod_name,
                'Specification-Vendor'    : mod_author,
                'Specification-Version'   : project.jar.archiveVersion,
                'Implementation-Title'    : project.name,
                'Implementation-Version'  : project.jar.archiveVersion,
                'Implementation-Vendor'   : mod_author,
                'Implementation-Timestamp': new Date().format("yyyy-MM-dd'T'HH:mm:ssZ"),
                'Timestamp'               : System.currentTimeMillis(),
                'Built-On-Java'           : "${System.getProperty('java.vm.version')} (${System.getProperty('java.vm.vendor')})",
                'Built-On-Minecraft'      : minecraft_version
            ])
        }
    }

    sourcesJar {
        from(rootProject.file('LICENSE.md')) {
            rename { "${it}_${mod_name}" }
        }
    }

    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
        options.release = 21
    }

    processResources {
        def replaceProperties = [
            minecraft_version     : minecraft_version,
            neoforge_version      : neoforge_version,
            fabric_loader_version : fabric_loader_version,
            loader_version_range  : loader_version_range,
            mod_id                : mod_id,
            mod_name              : mod_name,
            mod_version           : rootProject.version,
            mod_license           : mod_license,
            mod_author            : mod_author,
            mod_credits           : mod_credits,
            mod_description       : mod_description,
            mod_url               : mod_url,
            mod_issue_tracker_url : mod_issue_tracker_url,
        ]
        inputs.properties replaceProperties
        filesMatching(['pack.mcmeta', 'fabric.mod.json', 'META-INF/neoforge.mods.toml', '*.mixins.json']) {
            expand replaceProperties
        }
    }

    tasks.withType(GenerateModuleMetadata).configureEach {
        enabled = false
    }
}

allprojects {
    apply plugin: 'java'
    apply plugin: 'architectury-plugin'
    apply plugin: 'maven-publish'

    group = rootProject.group
    version = rootProject.version
}
